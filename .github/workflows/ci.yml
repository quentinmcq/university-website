name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Lint · Types · Build · HTML · Accessibilité · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun gère les dépendances et lance les scripts ; la version est lue dans `packageManager`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Node reste le moteur d'exécution d'Astro et des outils (binaires avec shebang node).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Formatage (oxfmt)
        run: bun run format:check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Types (astro check)
        run: bun run check

      - name: Build (Astro + Pagefind)
        run: bun run build

      - name: Validation HTML (html-validate)
        run: bun run test:html

      - name: Accessibilité (pa11y-ci, WCAG 2 AA)
        run: bun run test:a11y

      - name: Performance (Lighthouse CI)
        run: bun run test:perf

      - name: Publier le site construit et les rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-et-rapports
          path: |
            dist
            .lighthouseci/reports
          retention-days: 14
