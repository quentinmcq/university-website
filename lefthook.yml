pre-commit:
  jobs:
    - name: oxfmt
      glob: '*.{js,mjs,cjs,ts,mts,cts,json,jsonc,css,md,yml,yaml}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: bun run lint
    - name: format check
      run: bun run format:check
